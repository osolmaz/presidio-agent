name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Fonts used to redraw values, and poppler for PDFs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-liberation fonts-dejavu-core poppler-utils
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy presidio_agent tests
      - run: uv run pytest --cov=presidio_agent --cov-fail-under=85
      - name: Mutation testing behind the kill-rate floor
        run: uv run python scripts/check-mutation.py --min-kill-rate 85
      - name: Audit dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --disable-pip --no-deps
      - run: uvx slophammer-py@0.5.0 dry .
      - run: uvx slophammer-py@0.5.0 check .
