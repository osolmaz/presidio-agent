[project]
name = "synthero"
version = "0.1.0"
description = "Synthetic copies of scanned documents with consistent invented personal data"
requires-python = ">=3.11"
dependencies = ["Pillow>=12.1"]

[project.scripts]
synthero = "synthero.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "mutmut>=3.2,<4"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["synthero"]

[tool.setuptools.package-data]
synthero = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["mutants"]

[tool.ruff.lint]
select = ["A", "B", "C4", "C90", "E", "F", "I", "N", "ANN", "PL", "RUF", "SIM", "TID", "UP"]
ignore = ["PLR2004", "PLR0913", "PLR0917"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Tests are exempt from annotation coverage by convention.
"tests/**" = ["ANN"]

[tool.mypy]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# Mutation targets the pure logic that decides what is personal data and where it is;
# cli.py, vl.py, and ocr.py are IO and are covered by behaviour tests.
[tool.mutmut]
paths_to_mutate = ["synthero/match.py", "synthero/geometry.py", "synthero/values.py", "synthero/leak.py",
                   "synthero/detect.py", "synthero/barcode.py"]
tests_dir = ["tests/"]
also_copy = ["synthero/"]

[[tool.mypy.overrides]]
# Tests are exempt from annotation coverage, as in Ruff above.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
