[project]
name = "synthero"
version = "0.1.0"
description = "Synthetic copies of scanned documents with consistent invented personal data"
requires-python = ">=3.11"
dependencies = ["Pillow>=10"]

[project.scripts]
synthero = "synthero.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["synthero"]

[tool.ruff]
line-length = 120
